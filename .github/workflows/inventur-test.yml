name: Inventur-App im Emulator testen

on:
  push:
    branches: [inventur-app]
    paths:
      - "inventur/**"
      - ".github/workflows/inventur-test.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APKs bauen
        working-directory: inventur
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Durchlauf im Emulator (Android 13)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            adb install -r inventur/app/build/outputs/apk/debug/app-debug.apk
            adb install -r inventur/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class de.inventur.app.SmokeTest de.inventur.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            mkdir -p shots
            for f in $(adb shell run-as de.inventur.app ls files/shots | tr -d '\r'); do adb exec-out run-as de.inventur.app cat files/shots/$f > shots/$f; done
            adb logcat -d -s AndroidRuntime:E > shots/crash_log.txt || true
            ls -la shots

      - name: Ergebnis prüfen
        run: |
          cat instrument.txt
          grep -q "OK (1 test)" instrument.txt && echo "::notice title=Emulator-Test::Durchlauf erfolgreich" || { echo "::error title=Emulator-Test::Durchlauf fehlgeschlagen"; exit 1; }

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
