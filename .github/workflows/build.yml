name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk ScanListe.apk

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ScanListe-apk
          path: ScanListe.apk

      - name: Als Download unter "Releases" bereitstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version ScanListe.apk \
            --title "ScanListe – neueste Version" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Datei ScanListe.apk herunterladen und auf dem TC22 installieren."
