name: Scan-Portal bauen

on:
  push:
    branches: [main, scan-portal]
    paths:
      - "scanportal/**"
      - ".github/workflows/scanportal.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: scanportal

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK prüfen
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests (Import, Zähllogik, CSV)
        run: |
          gradle testDebugUnitTest --no-daemon
          T=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testsuite [^>]*' | grep -oE 'tests="[0-9]+"' | grep -oE '[0-9]+' | paste -sd+ | bc)
          F=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testsuite [^>]*' | grep -oE 'failures="[0-9]+"' | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "::notice title=Tests::$T Tests ausgeführt, $F fehlgeschlagen"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Scan-Portal.apk

      - name: Offline-Prüfung der fertigen APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          PERMS=$("$BT/aapt2" dump permissions Scan-Portal.apk)
          NET_PERMS=$(echo "$PERMS" | grep -E "INTERNET|NETWORK_STATE|WIFI_STATE|ACCOUNTS|SYNC|AD_ID" || true)
          {
            echo "## Offline-Prüfung"
            echo '```'; echo "$PERMS"; echo '```'
            echo "Netzwerk-/Konto-Berechtigungen: ${NET_PERMS:-keine ✅}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$NET_PERMS" ]; then
            echo "::error::Die APK enthält Netzwerk- oder Konto-Berechtigungen. Bau abgebrochen."
            exit 1
          fi

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Scan-Portal-apk
          path: scanportal/Scan-Portal.apk

      - name: Als Download unter "Releases" bereitstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete scanportal-neueste-version --yes --cleanup-tag || true
          gh release create scanportal-neueste-version Scan-Portal.apk \
            --target "$GITHUB_SHA" \
            --title "Scan-Portal – neueste Version" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7} (Zweig ${GITHUB_REF_NAME}). Datei Scan-Portal.apk herunterladen und auf dem TC22 installieren."
