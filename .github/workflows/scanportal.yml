name: Scan-Portal bauen

on:
  push:
    branches: [main, scan-portal]
    paths:
      - "scanportal/**"
      - ".github/workflows/scanportal.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: scanportal

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK prüfen
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests (Import, Zähllogik, CSV)
        run: |
          gradle testDebugUnitTest --no-daemon
          T=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testsuite [^>]*' | grep -oE 'tests="[0-9]+"' | grep -oE '[0-9]+' | paste -sd+ | bc)
          F=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testsuite [^>]*' | grep -oE 'failures="[0-9]+"' | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "::notice title=Tests::$T Tests ausgeführt, $F fehlgeschlagen"

      - name: APK bauen
        run: gradle assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk Scan-Portal.apk

      - name: Offline-Prüfung der fertigen APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          A="$BT/aapt2"; APK=Scan-Portal.apk
          PERMS=$("$A" dump permissions $APK)
          MANIFEST=$("$A" dump xmltree --file AndroidManifest.xml $APK)
          DEX=$(unzip -p $APK 'classes*.dex' | strings)
          RULES=$("$A" dump xmltree --file res/xml/data_extraction_rules.xml $APK 2>&1 || true)

          NET_PERMS=$(echo "$PERMS" | grep -E "INTERNET|NETWORK_STATE|WIFI_STATE|ACCOUNTS|SYNC|AD_ID|BLUETOOTH|NFC|LOCATION" || true)
          BACKUP=$(echo "$MANIFEST" | grep -E "allowBackup|dataExtractionRules|fullBackupContent|usesCleartextTraffic|backupAgent" || true)
          COMPONENTS=$(echo "$MANIFEST" | grep -E "E: (activity|service|receiver|provider)" -A6 | grep -E "E: |A: android:name|A: android:exported|A: android:permission" | sed 's/^ *//' || true)
          METADATA=$(echo "$MANIFEST" | grep -A3 "E: meta-data" | grep "android:name" | sed 's/^ *//' || true)
          LIBS=$(echo "$DEX" | grep -oE "Lcom/google/(firebase|android/gms)[^;]*|Lokhttp3/[^;]*|Lretrofit2/[^;]*|Lio/sentry/[^;]*|Lcom/crashlytics/[^;]*|Landroidx/work/[^;]*" | sort -u | head -20 || true)
          NETCODE=$(echo "$DEX" | grep -oE "Ljava/net/(HttpURLConnection|Socket|URLConnection|DatagramSocket)[^;]*|Ljavax/net/ssl/[^;]*|Landroid/webkit/WebView;|Landroid/accounts/AccountManager;|Landroid/content/AbstractThreadedSyncAdapter;|Landroid/app/backup/[^;]*" | sort -u || true)
          PKGS=$(echo "$DEX" | grep -oE "^L[a-z0-9]+/[a-z0-9]+/[a-z0-9]+" | sort | uniq -c | sort -rn | head -25 || true)

          mkdir -p ../pruefbericht
          {
            echo "# Offline-Prüfbericht Scan-Portal"
            echo "Commit ${GITHUB_SHA::7}, gebaut $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo; echo "## 1. Berechtigungen der APK"; echo '```'; echo "$PERMS"; echo '```'
            echo "Netzwerk/Konten/Funk: ${NET_PERMS:-keine}"
            echo; echo "## 2. Backup-/Netz-Einstellungen im Manifest"; echo '```'; echo "$BACKUP"; echo '```'
            echo; echo "## 3. Regeln für Cloud-Backup und Geräteumzug (data_extraction_rules)"; echo '```'; echo "$RULES"; echo '```'
            echo; echo "## 4. App-Komponenten (inkl. aus Bibliotheken)"; echo '```'; echo "$COMPONENTS"; echo '```'
            echo; echo "## 5. Automatisch startende Bibliotheks-Initialisierer (meta-data)"; echo '```'; echo "${METADATA:-keine}"; echo '```'
            echo; echo "## 6. Cloud-/Tracking-/Hintergrund-Bibliotheken im Code"; echo "${LIBS:-keine}"
            echo; echo "## 7. Netzwerk-, Konto-, Sync- und Backup-Klassen im Code"; echo '```'; echo "${NETCODE:-keine}"; echo '```'
            echo; echo "## 8. Größte Code-Pakete (Herkunft des Codes)"; echo '```'; echo "$PKGS"; echo '```'
          } > ../pruefbericht/PRUEFBERICHT.md
          cat ../pruefbericht/PRUEFBERICHT.md >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Netzwerk-Berechtigungen::${NET_PERMS:-keine}"
          echo "::notice title=Backup::$(echo "$BACKUP" | tr -s ' ' | tr '\n' ' ')"
          echo "::notice title=Netzwerk-Klassen::$(echo "${NETCODE:-keine}" | tr '\n' ' ')"
          echo "::notice title=Initialisierer::$(echo "${METADATA:-keine}" | grep -oE '"[^"]+"' | tr '\n' ' ')"
          if [ -n "$NET_PERMS" ]; then
            echo "::error::Die APK enthält Netzwerk-, Konto- oder Funk-Berechtigungen. Bau abgebrochen."
            exit 1
          fi
          if ! echo "$BACKUP" | grep -q 'allowBackup.*=false'; then
            echo "::error::allowBackup ist nicht ausgeschaltet. Bau abgebrochen."
            exit 1
          fi

      - name: Prüfbericht in Zweig "scanportal-pruefbericht" ablegen
        working-directory: pruefbericht
        run: |
          git init -q -b scanportal-pruefbericht
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Prüfbericht aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" scanportal-pruefbericht

      - name: Als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Scan-Portal-apk
          path: scanportal/Scan-Portal.apk

      - name: Als Download unter "Releases" bereitstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete scanportal-neueste-version --yes --cleanup-tag || true
          gh release create scanportal-neueste-version Scan-Portal.apk \
            --target "$GITHUB_SHA" \
            --title "Scan-Portal – neueste Version" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7} (Zweig ${GITHUB_REF_NAME}). Datei Scan-Portal.apk herunterladen und auf dem TC22 installieren."
