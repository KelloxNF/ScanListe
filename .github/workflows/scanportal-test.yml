name: Scan-Portal im Emulator testen

on:
  push:
    branches: [scan-portal]
    paths:
      - "scanportal/**"
      - ".github/workflows/scanportal-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APKs bauen
        working-directory: scanportal
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Durchlauf im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 1500
          ram-size: 4096M
          disk-size: 6000M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            adb install -r scanportal/app/build/outputs/apk/debug/app-debug.apk
            adb install -r scanportal/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class de.inventur.app.SmokeTest de.scanportal.app.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            mkdir -p shots
            for f in $(adb shell run-as de.scanportal.app ls files/shots | tr -d '\r'); do adb exec-out run-as de.scanportal.app cat files/shots/$f > shots/$f; done
            adb logcat -d -s AndroidRuntime:E > shots/crash_log.txt || true
            ls -la shots

      - name: Ergebnis prüfen
        run: |
          cat instrument.txt
          grep -q "OK (1 test)" instrument.txt && echo "::notice title=Emulator-Test::Durchlauf erfolgreich" || { echo "::error title=Emulator-Test::Durchlauf fehlgeschlagen"; exit 1; }

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Screenshots in Zweig "scanportal-screenshots" ablegen
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b scanportal-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" scanportal-screenshots
